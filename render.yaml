services:
  - type: web
    name: idsai-demo
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: idsai-demo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AUTO_MIGRATE
        value: "true"
      - key: EMAIL_ENABLED
        value: "false"
      - key: NOTIFICATIONS_OUTBOX_POLL_SECONDS
        value: "3"
      - key: AUTH_AUTO_VERIFY_REGISTRATIONS
        value: "true"
      - key: BACKGROUND_JOBS_ENABLED
        value: "false"
      - key: REDIS_ADDR
        value: ""
      - key: HEALTH_MONITOR_ENABLED
        value: "false"
      - key: LOCAL_STORAGE_DIR
        value: "/tmp/idsai-media"

databases:
  - name: idsai-demo-db
    plan: free
