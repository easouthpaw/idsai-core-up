<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IDSAI Corp. Review Requests</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/dev/static/css/professor.css" />
  <link rel="stylesheet" href="/dev/static/css/notifications-popup.css" />
  <link rel="stylesheet" href="/dev/static/css/dev-theme.css" />
</head>
<body class="professor-body">
  <aside class="prof-sidebar">
    <div class="prof-brand">
      <img src="/dev/static/assets/idsai-corp-logo.png" alt="IDSAI Corp. logo" />
      <div>
        <strong>IDSAI Corp.</strong>
        <p>Преподаватель</p>
      </div>
    </div>

    <div class="prof-user">
      <div id="profAvatar" class="avatar">PR</div>
      <div>
        <strong id="profName">Профессор</strong>
        <p id="profEmail">professor@idsai.dev</p>
      </div>
    </div>

    <nav class="prof-nav">
      <a href="/dev/professor">Дашборд</a>
      <a class="active" href="/dev/professor/reviews">Заявки на ревью</a>
      <a href="/dev/professor/criteria">Критерии</a>
      <a href="/dev/professor/grading">Оценивание</a>
      <a href="/dev/projects">Проекты</a>
    </nav>

    <footer class="prof-sidebar-foot">
      <button id="logoutBtn" type="button">Выйти</button>
    </footer>
  </aside>

  <main class="prof-main">
    <header class="prof-header">
      <div>
        <p class="crumb">Входящие проекты</p>
        <h1>Заявки на ревью</h1>
      </div>
      <div class="head-actions">
        <a class="ghost-btn" href="/dev/professor">Назад к дашборду</a>
      </div>
    </header>

    <section class="table-card">
      <div class="table-head">
        <h2>Ожидают решения</h2>
        <button id="refreshBtn" class="ghost-btn" type="button">Обновить</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Проект</th>
              <th>Команда</th>
              <th>Статус</th>
              <th>Действия</th>
            </tr>
          </thead>
          <tbody id="reviewsBody">
            <tr><td colspan="4">Загрузка...</td></tr>
          </tbody>
        </table>
      </div>
      <p id="pageStatus" class="page-status"></p>
    </section>
  </main>

  <script src="/dev/static/js/auth-session.js" defer></script>
  <script src="/dev/static/js/notifications-popup.js?v=20260307-2" defer></script>
  <script src="/dev/static/js/professor.js" defer></script>
