<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IDSAI Corp. Review Requests</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/dev/static/css/professor.css" />
  <link rel="stylesheet" href="/dev/static/css/notifications-popup.css" />
  <link rel="stylesheet" href="/dev/static/css/dev-theme.css" />
</head>
<body class="professor-body">
  <aside
    data-role-sidebar
    data-sidebar-role="teacher"
    data-sidebar-active="reviews"
    class="prof-sidebar"
  ></aside>

  <main class="prof-main">
    <header class="prof-header">
      <div>
        <p class="crumb">Входящие проекты</p>
        <h1>Заявки на ревью</h1>
      </div>
      <div class="head-actions">
        <a class="ghost-btn" href="/dev/professor">Назад к дашборду</a>
      </div>
    </header>

    <section class="table-card">
      <div class="table-head">
        <h2>Ожидают решения</h2>
        <button id="refreshBtn" class="ghost-btn" type="button">Обновить</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Проект</th>
              <th>Команда</th>
              <th>Статус</th>
              <th>Действия</th>
            </tr>
          </thead>
          <tbody id="reviewsBody">
            <tr><td colspan="4">Загрузка...</td></tr>
          </tbody>
        </table>
      </div>
      <p id="pageStatus" class="page-status" aria-live="polite"></p>
    </section>
  </main>

  <script src="/dev/static/js/auth-session.js" defer></script>
  <script src="/dev/static/js/role-sidebar.js" defer></script>
  <script src="/dev/static/js/notifications-popup.js?v=20260307-2" defer></script>
  <script src="/dev/static/js/professor.js" defer></script>
</body>
</html>
