<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IDSAI Corp. Invites</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/dev/static/css/projects.css" />
  <link rel="stylesheet" href="/dev/static/css/role-sidebar.css" />
  <link rel="stylesheet" href="/dev/static/css/notifications-popup.css" />
  <link rel="stylesheet" href="/dev/static/css/dev-theme.css" />
  <link rel="stylesheet" href="/dev/static/css/site-preferences.css" />
  <link rel="stylesheet" href="/dev/static/css/invites.css?v=workspace-redesign-3" />
  <script>
    (() => {
      try {
        const lang = localStorage.getItem("idsai_site_lang");
        if (lang) document.documentElement.lang = lang;
      } catch (_) {}
    })();
  </script>
</head>
<body class="projects-body invites-body app-loading">
  <div class="layout">
    <aside
      data-role-sidebar
      data-sidebar-role="student"
      data-sidebar-active="invites"
      class="role-sidebar"
    ></aside>

    <div class="content-shell">
      <header class="topbar">
        <div class="breadcrumbs">
          <span>idsai-corp</span>
          <span>/</span>
          <strong>invites</strong>
        </div>
      </header>

      <main class="content invites-content">
        <section class="hero invites-hero">
          <div>
            <span class="invites-kicker">Project inbox</span>
            <h1>Заявки</h1>
            <p>Входящие решения и ваши отправленные заявки видны рядом, без переключения контекста.</p>
          </div>
          <a class="create-btn" href="/dev/projects">Открыть проекты</a>
        </section>

        <section class="invite-tabs" role="tablist" aria-label="Invites overview">
          <button id="tabIncoming" class="invite-tab active" type="button" role="tab" aria-selected="true">
            Нужно ответить
            <span id="incomingCount" class="tab-count">0</span>
          </button>
          <button id="tabOutgoing" class="invite-tab" type="button" role="tab" aria-selected="false">
            Мои заявки
            <span id="outgoingCount" class="tab-count">0</span>
          </button>
        </section>

        <div class="invites-board">
          <section id="incomingPane" class="invite-pane active">
            <div class="invite-pane__head">
              <div>
                <h2>Ожидают решения</h2>
                <p>Приглашения в проекты и заявки участников.</p>
              </div>
            </div>
            <div id="incomingList" class="invite-list"></div>
          </section>

          <section id="outgoingPane" class="invite-pane active invite-pane--secondary">
            <div class="invite-pane__head">
              <div>
                <h2>Отправлены вами</h2>
                <p>Статусы заявок в команды проектов.</p>
              </div>
            </div>
            <div id="outgoingList" class="invite-list"></div>
          </section>
        </div>

        <p id="pageStatus" class="page-status" aria-live="polite"></p>
      </main>
    </div>
  </div>

  <script src="/dev/static/js/site-preferences.js" defer></script>
  <script src="/dev/static/js/auth-session.js" defer></script>
  <script src="/dev/static/js/role-sidebar.js" defer></script>
  <script src="/dev/static/js/notifications-popup.js?v=20260307-2" defer></script>
  <script src="/dev/static/js/invites.js" defer></script>
</body>
</html>
