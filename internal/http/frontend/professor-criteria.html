<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IDSAI Corp. Criteria Setup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Material+Symbols+Outlined:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/dev/static/css/role-sidebar.css" />
  <link rel="stylesheet" href="/dev/static/css/professor.css" />
  <link rel="stylesheet" href="/dev/static/css/notifications-popup.css" />
  <link rel="stylesheet" href="/dev/static/css/dev-theme.css" />
  <link rel="stylesheet" href="/dev/static/css/site-preferences.css" />
  <script>
    (() => {
      try {
        const lang = localStorage.getItem("idsai_site_lang");
        if (lang) document.documentElement.lang = lang;
      } catch (_) {}
    })();
  </script>
</head>
<body class="professor-body">
  <aside
    data-role-sidebar
    data-sidebar-role="teacher"
    data-sidebar-active="criteria"
    class="role-sidebar"
  ></aside>

  <main class="prof-main criteria-main">
    <section class="criteria-shell">
      <header class="criteria-page-head">
        <p class="crumb">Критерии оценки</p>
        <h1>Настройка критериев оценки</h1>
        <p class="head-sub">Управление чек-листами для проверки студенческих проектов и лабораторных работ.</p>
      </header>

      <section class="table-card criteria-context-card">
        <div class="criteria-context-grid two">
          <div class="criteria-context-field">
            <label for="projectSelect">Проект</label>
            <select id="projectSelect" name="project_id" autocomplete="off"></select>
          </div>
          <div class="criteria-context-field">
            <label for="projectStatusView">Статус</label>
            <input id="projectStatusView" type="text" name="project_status" autocomplete="off" readonly value="—" />
          </div>
        </div>
      </section>

      <section class="criteria-banner">
        <div class="banner-icon">i</div>
        <div>
          <strong>Режим редактирования</strong>
          <p>Изменения применяются сразу для команды проекта. Участники увидят обновлённый список после сохранения.</p>
        </div>
      </section>

      <section class="table-card criteria-editor-card">
        <div class="table-head criteria-editor-head">
          <div class="criteria-editor-title">
            <h2>CRITERIA_LIST.md</h2>
            <span class="criteria-editor-meta">read-write</span>
            <span id="criteriaWeightMeta" class="criteria-editor-meta criteria-weight-meta">Вес 0 / 100</span>
          </div>
          <button id="loadTemplateBtn" class="ghost-btn criteria-template-btn" type="button">Загрузить шаблон</button>
        </div>

        <div id="criteriaList" class="criteria-list"></div>

        <div class="criteria-add-wrap">
          <button id="openComposerBtn" class="ghost-btn criteria-add-trigger" type="button">Добавить критерий</button>

          <form id="criterionForm" class="criterion-form-grid" hidden>
            <div class="field-grid two">
              <div>
                <label for="criterionTitleInput">Название</label>
                <input id="criterionTitleInput" type="text" name="criterion_title" autocomplete="off" placeholder="Например: Покрытие тестами > 80%" required />
              </div>
              <div>
                <label for="criterionWeightInput">Вес (1-100)</label>
                <input id="criterionWeightInput" type="number" name="criterion_weight" autocomplete="off" min="1" max="100" value="10" required />
              </div>
            </div>
            <div>
              <label for="criterionDescInput">Описание</label>
              <textarea id="criterionDescInput" name="criterion_description" autocomplete="off" placeholder="Что именно проверяет критерий"></textarea>
            </div>
            <div class="form-actions">
              <button id="cancelComposerBtn" class="ghost-btn" type="button">Отмена</button>
              <button id="criterionSubmitBtn" class="primary-btn" type="submit">Добавить критерий</button>
            </div>
          </form>
        </div>

        <div class="criteria-footer-actions">
          <button id="cancelBottomBtn" class="ghost-btn" type="button">Отмена</button>
          <button id="saveTemplateBtn" class="ghost-btn" type="button">Сохранить как шаблон</button>
          <button id="saveBottomBtn" class="primary-btn" type="button">Готово</button>
        </div>
      </section>

      <p id="pageStatus" class="page-status" aria-live="polite"></p>
    </section>
  </main>

  <script src="/dev/static/js/site-preferences.js" defer></script>
  <script src="/dev/static/js/auth-session.js" defer></script>
  <script src="/dev/static/js/role-sidebar.js" defer></script>
  <script src="/dev/static/js/notifications-popup.js?v=20260307-2" defer></script>
  <script src="/dev/static/js/professor-criteria.js" defer></script>
</body>
</html>
