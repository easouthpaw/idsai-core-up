<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IDSAI Corp. 404</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/dev/static/css/dev-theme.css" />
  <link rel="stylesheet" href="/dev/static/css/not-found.css" />
</head>
<body class="auth-body not-found-body">
  <main class="not-found-shell">
    <a class="not-found-brand" href="/" aria-label="IDSAI Corp.">
      <img src="/dev/static/assets/idsai-corp-logo.png" alt="IDSAI Corp. logo" width="52" height="52" />
      <span>
        <strong>IDSAI Corp.</strong>
        <small>Page Missing</small>
      </span>
    </a>

    <section class="not-found-card" aria-labelledby="notFoundTitle">
      <p class="not-found-code">404</p>
      <h1 id="notFoundTitle">Страница не найдена</h1>
      <p class="not-found-copy">Адрес изменился, ссылка устарела или запрошенный объект больше не существует.</p>

      <div class="not-found-path">
        <span>Запрошенный путь</span>
        <code id="missingPath">/</code>
      </div>

      <div class="not-found-actions">
        <a id="workspaceLink" class="primary not-found-btn" href="/dev/projects">В кабинет</a>
        <a class="not-found-btn not-found-btn--ghost" href="/">На главную</a>
      </div>
    </section>
  </main>

  <script src="/dev/static/js/auth-session.js" defer></script>
  <script src="/dev/static/js/not-found.js" defer></script>
</body>
</html>
