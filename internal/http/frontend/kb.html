<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IDSAI Corp. — База знаний</title>
  <meta name="description" content="База знаний IDSAI — инструкции, гайды и документация" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Material+Symbols+Outlined:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/dev/static/css/projects.css" />
  <link rel="stylesheet" href="/dev/static/css/role-sidebar.css" />
  <link rel="stylesheet" href="/dev/static/css/dev-theme.css" />
  <link rel="stylesheet" href="/dev/static/css/kb.css" />
  <link rel="stylesheet" href="/dev/static/css/notifications-popup.css" />
  <link rel="stylesheet" href="/dev/static/css/site-preferences.css" />
  <script>
    (() => {
      try {
        const stored = localStorage.getItem("idsai_site_lang");
        const lang = stored || "kk";
        if (!stored) localStorage.setItem("idsai_site_lang", lang);
        document.documentElement.lang = lang;
      } catch (_) {}
    })();
  </script>
</head>
<body class="projects-body kb-body app-loading">
  <div class="layout">
    <aside data-role-sidebar data-sidebar-role="auto" data-sidebar-active="kb" class="role-sidebar"></aside>

    <div class="content-shell">
      <!-- Topbar -->
      <header class="topbar">
        <div class="topbar-inner" style="display:flex;align-items:center;gap:16px;height:100%;padding:0 24px;">
          <nav class="breadcrumbs" style="display:flex;align-items:center;gap:8px;font:600 14px/1 'Inter',sans-serif;">
            <a href="/dev/kb" style="color:var(--kb-accent);text-decoration:none;">База знаний</a>
            <span style="color:var(--kb-muted);">·</span>
            <strong id="breadcrumbCategory">Все статьи</strong>
          </nav>
          <div style="flex:1;"></div>
          <div id="notificationsPopup"></div>
        </div>
      </header>

      <!-- Main -->
      <div class="kb-layout">
        <!-- Tree sidebar -->
        <aside class="kb-tree-sidebar">
          <h3>Категории</h3>
          <div id="categoryTree" class="kb-tree-list"></div>

          <div id="categoryActions" class="kb-sidebar-actions" style="display:none;">
            <button id="addCategoryBtn" class="kb-btn kb-btn--primary full-w" type="button">
              <span class="material-symbols-outlined" aria-hidden="true">create_new_folder</span>
              Новая категория
            </button>
          </div>
        </aside>

        <!-- Main content -->
        <main class="kb-main">
          <!-- Search -->
          <div class="kb-search-bar">
            <span class="material-symbols-outlined" aria-hidden="true">search</span>
            <input id="searchInput" class="kb-search-input" type="text" placeholder="Поиск по базе знаний…" autocomplete="off" />
            <kbd class="kb-search-kbd">Ctrl+K</kbd>
          </div>

          <!-- Tags -->
          <div id="tagsBar" class="kb-tags-bar"></div>

          <!-- Article actions for editors -->
          <div id="editorActions" style="display:none;gap:10px;">
            <button id="createArticleBtn" class="kb-btn kb-btn--primary" type="button">
              <span class="material-symbols-outlined" aria-hidden="true">add</span>
              Новая статья
            </button>
            <label class="kb-btn kb-btn--outline" style="cursor:pointer;">
              <span class="material-symbols-outlined" aria-hidden="true">upload_file</span>
              Загрузить .md
              <input id="uploadMdFile" type="file" accept=".md,.markdown,.txt" style="display:none;" />
            </label>
          </div>

          <!-- Article list -->
          <div id="articleList" class="kb-article-list"></div>

          <!-- Empty state -->
          <div id="emptyState" class="kb-empty" style="display:none;">
            <span class="material-symbols-outlined" aria-hidden="true">menu_book</span>
            <p>Статьи пока не добавлены</p>
          </div>

          <!-- Pagination -->
          <div id="pagination" class="kb-pagination" style="display:none;">
            <button id="prevPage" type="button">← Назад</button>
            <span id="pageInfo"></span>
            <button id="nextPage" type="button">Вперёд →</button>
          </div>
        </main>
      </div>
    </div>
  </div>

  <!-- Category Modal -->
  <div id="categoryModal" class="kb-modal-backdrop" style="display:none;">
    <div class="kb-modal">
      <h2 id="categoryModalTitle">Новая категория</h2>
      <div class="kb-editor-container">
        <div class="kb-editor-fields">
          <div class="kb-editor-field">
            <label for="catTitleInput">Название</label>
            <input id="catTitleInput" type="text" placeholder="Гайды по Git" />
          </div>
          <div class="kb-editor-field">
            <label for="catParentSelect">Родительская категория</label>
            <select id="catParentSelect">
              <option value="">— Корень —</option>
            </select>
          </div>
        </div>
      </div>
      <div class="kb-modal-actions">
        <button id="cancelCatBtn" class="kb-btn kb-btn--outline" type="button">Отмена</button>
        <button id="saveCatBtn" class="kb-btn kb-btn--primary" type="button">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Article Create Modal -->
  <div id="articleModal" class="kb-modal-backdrop" style="display:none;">
    <div class="kb-modal" style="max-width:860px;">
      <h2 id="articleModalTitle">Новая статья</h2>
      <div class="kb-editor-container">
        <div class="kb-editor-fields">
          <div class="kb-editor-field">
            <label for="artTitleInput">Заголовок</label>
            <input id="artTitleInput" type="text" placeholder="Основы ветвления в Git" />
          </div>
          <div class="kb-editor-field">
            <label for="artCategorySelect">Категория</label>
            <select id="artCategorySelect"></select>
          </div>
          <div class="kb-editor-field">
            <label for="artTagsInput">Теги (через запятую)</label>
            <input id="artTagsInput" type="text" placeholder="git, ветвление, basics" />
          </div>
          <div class="kb-editor-field">
            <label for="artStatusSelect">Статус</label>
            <select id="artStatusSelect">
              <option value="DRAFT">Черновик</option>
              <option value="PUBLISHED">Опубликовать</option>
            </select>
          </div>
        </div>
        <div class="kb-editor-tabs">
          <button class="kb-editor-tab is-active" data-tab="write" type="button">Редактор</button>
          <button class="kb-editor-tab" data-tab="preview" type="button">Предпросмотр</button>
        </div>
        <textarea id="artContentInput" class="kb-editor-textarea" placeholder="# Заголовок&#10;&#10;Напишите статью в формате Markdown…"></textarea>
        <div id="artPreview" class="kb-markdown" style="display:none;"></div>
      </div>
      <div class="kb-modal-actions">
        <button id="cancelArtBtn" class="kb-btn kb-btn--outline" type="button">Отмена</button>
        <button id="saveArtBtn" class="kb-btn kb-btn--primary" type="button">Сохранить</button>
      </div>
    </div>
  </div>

  <script src="/dev/static/js/site-preferences.js" defer></script>
  <script src="/dev/static/js/auth-session.js" defer></script>
  <script src="/dev/static/js/role-sidebar.js" defer></script>
  <script src="/dev/static/js/notifications-popup.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js" defer></script>
  <script src="/dev/static/js/kb.js" defer></script>
</body>
</html>
